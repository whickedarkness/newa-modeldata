name: Model maps

on:
  schedule:
    # every hour: each job checks whether a new complete run is out and skips if it's already published
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the newest runs are already published'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: gefs
            script: src/gefs.ts
            project: newa-modeldata
            site: https://newa-modeldata.pages.dev/
          - model: ecmwfeps
            script: src/ecmwf-eps.ts
            project: newa-ens-ecmwf
            site: https://newa-ens-ecmwf.pages.dev/
          - model: aifseps
            script: src/ecmwf-eps.ts --model aifs
            project: newa-ens-aifs
            site: https://newa-ens-aifs.pages.dev/
          - model: icon
            script: src/icon.ts
            project: newa-icon
            site: https://newa-icon.pages.dev/
    name: ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: ${{ matrix.model }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Unpack the processing job
        env:
          JOB_KEY: ${{ secrets.JOB_KEY }}
        run: |
          mkdir -p job
          printf '%s' "$JOB_KEY" > "$RUNNER_TEMP/k"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "file:$RUNNER_TEMP/k" -in job.enc | tar xz -C job
          rm -f "$RUNNER_TEMP/k"
          cd job && npm install --no-audit --no-fund --silent

      - name: Build probability + percentile maps
        working-directory: job
        run: node --max-old-space-size=8192 node_modules/tsx/dist/cli.mjs ${{ matrix.script }} --out ../out --site ${{ matrix.site }} ${{ inputs.force && '--force' || '' }}

      - name: Publish to Cloudflare Pages
        if: hashFiles('out/.skip') == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy out --project-name ${{ matrix.project }} --branch main --commit-dirty=true
